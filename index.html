<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NegOne</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f4f7f2 0%, #e8f0e5 100%);
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #79a159;
    }
    nav {
      display: flex;
      gap: 20px;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }
    nav a {
      text-decoration: none;
      color: #555;
      font-size: 14px;
      font-weight: 500;
    }
    .btn-login {
      background-color: #a3cc85;
      color: #1a330e;
      border: none;
      padding: 10px 22px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 68px;
      font-weight: 800;
      color: #2b2b2b;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      color: #555;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 35px;
    }
    .btn-gmail {
      background-color: #a3cc85;
      color: #1a330e;
      border: none;
      padding: 14px 32px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(163, 204, 133, 0.4);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">NegOne</div>
    <nav>
      <a href="#">🏠 Нүүр</a>
      <a href="#">🍴 Жорууд</a>
      <a href="#">👤 NegOne-ийн тухай</a>
    </nav>
    <button class="btn-login">Нэвтрэх</button>
  </header>
  <main>
    <h1>NegOne</h1>
    <p>AI-д суурилсан сэтгэлзүй, эрүүл амьдралын хэв маягийн таны хувийн туслах.</p>
    <button class="btn-gmail">Gmail-ээр нэвтрэх</button>
  </main>
</body>
</html>
